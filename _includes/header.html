<header class="site-header">
  <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Early Music Concerts home">
    <span>Early Music Concerts</span>
    <small>Performances of Medieval and Renaissance Music, 1915–1960</small>
  </a>

  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
    <span class="nav-toggle-label">Menu</span>
    <span class="nav-toggle-icon" aria-hidden="true"></span>
  </button>

  <nav id="primary-navigation" class="primary-nav" aria-label="Primary navigation">
    {% unless page.section == 'home' %}
      <a href="{{ '/' | relative_url }}">Home</a>
    {% endunless %}
    <a href="{{ '/about/' | relative_url }}"{% if page.section == 'about' %} aria-current="page"{% endif %}>About</a>
    <a href="{{ '/concerts/' | relative_url }}"{% if page.section == 'concerts' or page.section == 'program' or page.section == 'piece' or page.section == 'composer' %} aria-current="page"{% endif %}>Concerts</a>
    <a href="{{ '/analysis/' | relative_url }}"{% if page.section == 'analysis' %} aria-current="page"{% endif %}>Analysis</a>
    <a href="{{ '/documentation/' | relative_url }}"{% if page.section == 'documentation' %} aria-current="page"{% endif %}>Documentation</a>
  </nav>
</header>
